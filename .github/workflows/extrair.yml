name: Extrair projeto

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extrair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - name: Abrir repositorio
        uses: actions/checkout@v4

      - name: Extrair arquivos
        run: unzip -

      - name: Salvar projeto extraido
        run: unzip -o "Bora_de_Bus_Atualizacao_v0.2.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "Os arquivos ja estavam extraidos."
          else
            git commit -m "Extrair projeto Bora de Bus"
            git push origin HEAD:main
          fi
