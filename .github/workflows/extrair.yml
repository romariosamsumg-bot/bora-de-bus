name: Atualizar Bora de Bus

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extrair.yml'
      - 'Bora_de_Bus_Atualizacao_v0.5.zip'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extrair atualização
        run: unzip -o Bora_de_Bus_Atualizacao_v0.5.zip

      - name: Salvar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app lib scripts cloudflare/worker.ts cloudflare/mobility.ts ATUALIZAR.md
          git diff --cached --quiet || git commit -m "Aplicar Bora de Bus v0.5"
          git push
