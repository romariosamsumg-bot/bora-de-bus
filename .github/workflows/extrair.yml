name: Atualizar Bora de Busao

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extrair.yml'
      - 'Bora_de_Busao_Atualizacao_v0.6_sem_workflow.zip'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extrair atualização
        run: unzip -o Bora_de_Busao_Atualizacao_v0.6_sem_workflow.zip

      - name: Salvar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app lib scripts public/brand public/favicon.svg public/icon-192.png public/icon-512.png public/manifest.webmanifest cloudflare/index.html ATUALIZAR.md
          git diff --cached --quiet || git commit -m "Aplicar marca Bora de Busao v0.6"
          git push
